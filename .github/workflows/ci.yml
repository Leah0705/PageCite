name: CI

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  test:
    name: Test (backend)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pagecite
          POSTGRES_PASSWORD: pagecite
          POSTGRES_DB: pagecite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pagecite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://pagecite:pagecite@localhost:5432/pagecite
      REDIS_URL: redis://localhost:6379
      GOOGLE_API_KEY: fake-key-for-tests
      CLERK_JWT_KEY: fake-clerk-key-for-tests
      ANONYMIZED_TELEMETRY: "false"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-mpnet-base-v2-cross-encoder

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download ML models
        run: python -c "from rag.llm import get_embeddings; get_embeddings()"

      - name: Run tests
        run: pytest -q

  test-ui:
    name: Test (frontend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Run Jest tests
        run: npm test
        working-directory: web

      - name: Type check
        run: npx tsc --noEmit
        working-directory: web
